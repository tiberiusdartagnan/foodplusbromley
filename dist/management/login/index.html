<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Food+ Bromley Charity Login</title><meta name="description" content="Charity partner login for Food+ Bromley."><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{min-height:100vh;background:#f3f5f2;font-family:Arial,sans-serif}.brand{color:#3fbe54;font-weight:800}.panel{max-width:460px}.btn-food{background:#3fbe54;color:#fff}.notice{font-size:.9rem;color:#667}</style></head><body class="d-flex align-items-center"><main class="panel container"><div class="text-center mb-4"><h1 class="brand">Food+</h1><p class="text-secondary">Charity partner portal</p></div><section class="card border-0 shadow-sm"><div class="card-body p-4 p-md-5"><h2 class="h4 mb-2">Charity Login</h2><p class="text-secondary">Sign in to manage referrals, client records and collection notes.</p><form id="login-form" class="mt-4"><label class="form-label" for="email">Email address</label><input class="form-control mb-3" id="email" name="email" type="email" autocomplete="username" required><label class="form-label" for="password">Password</label><input class="form-control mb-3" id="password" name="password" type="password" autocomplete="current-password" required><div class="d-flex justify-content-between align-items-center mb-4"><div><input id="remember" type="checkbox"><label for="remember"> Remember me</label></div><a href="#reset">Forgotten password?</a></div><button class="btn btn-food w-100" type="submit">Log in</button><p id="status" class="notice mt-3 mb-0" role="status">MVP preview: account authentication is not connected yet.</p></form></div></section><p class="text-center mt-4"><a href="../../">Return to Food+ Bromley</a></p></main><script>document.querySelector('#login-form').addEventListener('submit',function(e){e.preventDefault();document.querySelector('#status').textContent='The charity portal interface is ready; secure authentication will be connected in the next backend phase.'})</script></body></html>
