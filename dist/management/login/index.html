<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Food+ Bromley Charity Login</title>
  <meta name="description" content="Charity partner login for Food+ Bromley.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>body{min-height:100vh;background:#f3f5f2;font-family:Arial,sans-serif}.brand{color:#3fbe54;font-weight:800}.panel{max-width:460px}.btn-food{background:#3fbe54;color:#fff}.notice{font-size:.9rem;color:#667}a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #ffbf47;outline-offset:3px}</style>
</head>
<body class="d-flex align-items-center">
  <main class="panel container">
    <div class="text-center mb-4"><h1 class="brand">Food+</h1><p class="text-secondary">Charity partner portal</p></div>
    <section class="card border-0 shadow-sm"><div class="card-body p-4 p-md-5">
      <h2 class="h4 mb-2">Management portal currently on hold</h2>
      <p class="text-secondary">The Food+ charity management portal is currently unavailable while the service is being reviewed. Please contact us using the form below and we will respond to your enquiry.</p>
      <form class="mt-4" action="https://formspree.io/f/mwloayal" method="POST">
        <input type="hidden" name="_subject" value="Food+ management portal enquiry">
        <label class="form-label" for="portal-name">Name</label><input class="form-control mb-3" id="portal-name" name="name" autocomplete="name" required>
        <label class="form-label" for="portal-email">Email address</label><input class="form-control mb-3" id="portal-email" name="email" type="email" autocomplete="email" required>
        <label class="form-label" for="portal-message">Enquiry</label><textarea class="form-control mb-3" id="portal-message" name="message" rows="5" required></textarea>
        <button class="btn btn-food w-100" type="submit">Contact info@foodplusbromley.com</button>
      </form>
    </div></section>
    <p class="text-center mt-4"><a href="mailto:info@foodplusbromley.com">Email info@foodplusbromley.com</a> · <a href="../../">Return to Food+ Bromley</a></p>
  </main>
</body>
</html>
